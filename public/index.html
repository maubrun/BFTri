<div id="root"></div>
<script type="text/babel" data-presets="react">

const { useState, useMemo, useEffect, useCallback } = React;

/* =====================================================================
   CONFIGURATION
   Les données (créneaux, encadrants, inscriptions) vivent dans la base de
   données du serveur : tout le monde voit la même chose. Le mot de passe
   administrateur est vérifié côté serveur (jamais présent dans cette page).
   ===================================================================== */
const IDENTITY_KEY = "bftri-identity-v2";
const TOKEN_KEY = "bftri-admin-token";
const getToken = () => { try { return sessionStorage.getItem(TOKEN_KEY); } catch (e) { return null; } };
const setToken = (t) => { try { if (t) sessionStorage.setItem(TOKEN_KEY, t); else sessionStorage.removeItem(TOKEN_KEY); } catch (e) {} };

async function api(path, body) {
  const headers = {};
  const tok = getToken();
  if (tok) headers.authorization = "Bearer " + tok;
  const opts = body === undefined ? { headers } : { method: "POST", headers: { ...headers, "content-type": "application/json" }, body: JSON.stringify(body) };
  let res;
  try { res = await fetch("/api/" + path, opts); }
  catch (e) { throw Object.assign(new Error("Connexion impossible. Vérifie ton réseau puis réessaie."), { status: 0 }); }
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(j.error || "Une erreur est survenue."), { status: res.status, state: j.state });
  return j;
}

/* ---------- Dates ---------- */
const JOURS = ["dim.", "lun.", "mar.", "mer.", "jeu.", "ven.", "sam."];
const MOIS = ["janv.", "fév.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
const pad = (n) => String(n).padStart(2, "0");
const parseISO = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const toISO = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fmtDate = (iso) => { const d = parseISO(iso); return `${JOURS[d.getDay()]} ${d.getDate()} ${MOIS[d.getMonth()]}`; };
const fmtDateYear = (iso) => `${fmtDate(iso)} ${parseISO(iso).getFullYear()}`;
const fmtTime = (t) => t.replace(":", "h");
const toMin = (t) => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const endTime = (s) => { const e = toMin(s.time) + (s.duree || 120); return `${pad(Math.floor(e / 60) % 24)}h${pad(e % 60)}`; };
const monthKey = (iso) => iso.slice(0, 7);
const monthLabel = (key) => { const [y, m] = key.split("-").map(Number); return `${MOIS[m - 1]} ${y}`; };
const _now = new Date();
const todayISO = toISO(_now);
const nowMin = _now.getHours() * 60 + _now.getMinutes();
// un créneau est "à venir" tant que sa fin n'est pas passée
const isUpcoming = (s) => s.date > todayISO || (s.date === todayISO && toMin(s.time) + (s.duree || 120) > nowMin);
const overlaps = (a, b) =>
  a.date === b.date &&
  toMin(a.time) < toMin(b.time) + (b.duree || 120) &&
  toMin(b.time) < toMin(a.time) + (a.duree || 120);

/* ---------- Vacances scolaires zone C (Créteil / Seine-et-Marne) 2026-2027 ---------- */
const VACANCES = [
  { id: "toussaint", label: "Toussaint 2026", debut: "2026-10-17", fin: "2026-11-02" },
  { id: "noel", label: "Noël 2026", debut: "2026-12-19", fin: "2027-01-04" },
  { id: "hiver", label: "Hiver 2027", debut: "2027-02-06", fin: "2027-02-22" },
  { id: "paques", label: "Printemps 2027", debut: "2027-04-03", fin: "2027-04-19" },
];
// Les vacances démarrent le samedi soir : le samedi de départ (debut) reste une journée normale.
const vacancesFor = (iso) => VACANCES.find((v) => iso > v.debut && iso <= v.fin);
const nextDay = (iso) => { const d = parseISO(iso); d.setDate(d.getDate() + 1); return toISO(d); };
const FERIES = { "2026-11-11": "Férié", "2027-05-01": "Férié", "2027-05-08": "Férié" };

/* ---------- Données de départ ---------- */
const CATEGORIES = [
  { id: "poussin", label: "Poussin", color: "#4E7A51" },
  { id: "pupille", label: "Pupille", color: "#2F6690" },
  { id: "benjamin", label: "Benjamin", color: "#B5622A" },
  { id: "minime", label: "Compet", color: "#7A3B69" },
];
const catInfo = (id) => CATEGORIES.find((c) => c.id === id) || CATEGORIES[0];
const catIdx = (id) => CATEGORIES.findIndex((c) => c.id === id);
// Un créneau peut concerner plusieurs groupes (ex. Poussin + Pupille).
const catsOf = (s) => (s.cats && s.cats.length ? s.cats : [s.cat]);
const catsLabel = (s) => catsOf(s).map((c) => catInfo(c).label).join(" + ");
const hasCat = (s, c) => catsOf(s).includes(c);
// Horaires et référents par défaut : [mercredi, samedi] (heure de début, durée en minutes)
const CAT_DEFAULTS = {
  poussin:  { wed: ["13:15", 105], sat: ["13:45", 135], refs: ["christophe lefevre", "cristina da silva"] },
  pupille:  { wed: ["13:15", 105], sat: ["13:45", 150], refs: ["mathieu", "marlie"] },
  benjamin: { wed: ["13:45", 135], sat: ["10:15", 135], refs: ["evan", "tibo"] },
  minime:   { wed: ["15:45", 135], sat: ["13:45", 135], refs: ["evan", "tibo"] },
};
// cats : tableau de groupes (le premier donne l'horaire et les référents par défaut ; le besoin est la somme des groupes)
function slotDefaults(cats, date, encadrants) {
  const list = Array.isArray(cats) ? cats : [cats];
  const cat = list[0];
  const d = CAT_DEFAULTS[cat] || CAT_DEFAULTS.poussin;
  const [time, duree] = date && parseISO(date).getDay() === 6 ? d.sat : d.wed;
  const idOf = (name) => { const e = (encadrants || []).find((x) => x.name.toLowerCase() === name); return e ? e.id : ""; };
  return { time, duree, referent: idOf(d.refs[0]), referent2: idOf(d.refs[1]), besoin: besoinFor(list) };
}
const refNames = (s, byId) => [s.referent, s.referent2].map((id) => id && byId[id] && byId[id].name).filter(Boolean);
const CAT_BESOIN = { poussin: 3, pupille: 3, benjamin: 2, minime: 4 }; // référents inclus
const besoinFor = (cats) => (Array.isArray(cats) ? cats : [cats]).reduce((n, c) => n + (CAT_BESOIN[c] || 0), 0);
const NIVEAUX = ["BF1", "BF2", "BF3", "BF4", "BF5", "STAPS", "Bénévole", "Entraîneur pro", "DEJEPS Triathlon"];
const NIVEAU_COLOR = { BF1: "#6E8B74", BF2: "#4E7A51", BF3: "#2F6690", BF4: "#1B4965", BF5: "#1B2430", STAPS: "#7A3B69", "Bénévole": "#B5622A", "Entraîneur pro": "#0F766E", "DEJEPS Triathlon": "#9A3412" };
const canRoute = (cats) => cats.includes("minime") || cats.includes("benjamin"); // groupes autorisés en Route

// Les référents comptent dans le nombre d'encadrants requis.
const presents = (s) => [...new Set([s.referent, s.referent2, ...s.inscrits].filter(Boolean))];
const isRefOf = (s, id) => !!id && (s.referent === id || s.referent2 === id);
const slotStatus = (s) => (s.besoin === 0 ? "annule" : presents(s).length >= s.besoin ? "complet" : "ouvert");
const sortSlots = (a, b) => a.date.localeCompare(b.date) || a.time.localeCompare(b.time) || catIdx(catsOf(a)[0]) - catIdx(catsOf(b)[0]);


/* ---------- Créneaux urgents (manque de monde dans les 48 h) ---------- */
const URGENT_HOURS = 48;
const startMs = (s) => { const [y, m, d] = s.date.split("-").map(Number); const [hh, mm] = s.time.split(":").map(Number); return new Date(y, m - 1, d, hh, mm).getTime(); };
const manque = (s) => Math.max(0, s.besoin - presents(s).length);
const urgentSlots = (sorties) => {
  const now = Date.now();
  return sorties
    .filter((s) => s.besoin > 0 && manque(s) > 0 && startMs(s) > now && startMs(s) - now <= URGENT_HOURS * 3600000)
    .sort(sortSlots);
};
const shareText = (list) =>
  "🚨 BFTRI – Encadrants recherchés (" + list.length + " créneau" + (list.length > 1 ? "x" : "") + ")\n\n" +
  list.map((s) => "• " + fmtDate(s.date) + " " + fmtTime(s.time) + "–" + endTime(s) + " · " + catsLabel(s) + " (" + s.lieu + ") : il manque " + manque(s) + " encadrant" + (manque(s) > 1 ? "s" : "")).join("\n") +
  "\n\nInscris-toi ici : " + location.origin;

/* ---------- Export agenda (.ics) ---------- */
const icsEscape = (s) => String(s || "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
const icsDT = (iso, time, addMin = 0) => {
  const [y, m, d] = iso.split("-").map(Number);
  const [hh, mm] = time.split(":").map(Number);
  const dt = new Date(y, m - 1, d, hh, mm + addMin);
  return `${dt.getFullYear()}${pad(dt.getMonth() + 1)}${pad(dt.getDate())}T${pad(dt.getHours())}${pad(dt.getMinutes())}00`;
};
function buildICS(list, byId) {
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//BFTRI//Encadrement jeunes//FR", "CALSCALE:GREGORIAN", "METHOD:PUBLISH"];
  list.forEach((s) => {
    const ref = refNames(s, byId).join(" et ") || "à définir";
    lines.push(
      "BEGIN:VEVENT",
      `UID:${s.id}-${s.date}@bftri-encadrement`,
      `DTSTAMP:${stamp}`,
      `DTSTART:${icsDT(s.date, s.time)}`,
      `DTEND:${icsDT(s.date, s.time, s.duree || 120)}`,
      `SUMMARY:${icsEscape("BFTRI - Encadrement " + (s.type === "vtt" ? "VTT" : "Route") + " " + catsLabel(s))}`,
      `LOCATION:${icsEscape(s.lieu)}`,
      `DESCRIPTION:${icsEscape((refNames(s, byId).length > 1 ? "Référents : " : "Référent : ") + ref)}`,
      "END:VEVENT"
    );
  });
  lines.push("END:VCALENDAR");
  return lines.join("\r\n");
}
function downloadICS(list, byId, filename) {
  const blob = new Blob([buildICS(list, byId)], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}

/* ---------- Icônes ---------- */
const Icon = ({ children, size = 16, ...p }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
       strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}>{children}</svg>
);
const MapPin = (p) => <Icon {...p}><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5"/></Icon>;
const Clock = (p) => <Icon {...p}><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></Icon>;
const Plus = (p) => <Icon {...p}><path d="M12 5v14M5 12h14"/></Icon>;
const XIcon = (p) => <Icon {...p}><path d="M18 6 6 18M6 6l12 12"/></Icon>;
const Check = (p) => <Icon {...p}><path d="M20 6 9 17l-5-5"/></Icon>;
const AlertTriangle = (p) => <Icon {...p}><path d="M10.3 3.9 1.9 18a2 2 0 0 0 1.7 3h16.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></Icon>;
const UserCircle2 = (p) => <Icon {...p}><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M6.5 19a6 6 0 0 1 11 0"/></Icon>;
const ShieldCheck = (p) => <Icon {...p}><path d="M12 3 4 6v6c0 4.5 3.2 7.7 8 9 4.8-1.3 8-4.5 8-9V6Z"/><path d="m9 12 2 2 4-4"/></Icon>;
const RoadIcon = (p) => <Icon {...p}><path d="M9 3 4 21"/><path d="M15 3l5 18"/><path d="M12 7v2M12 12v2M12 17v2" strokeDasharray="2 3"/></Icon>;
const Bike = (p) => <Icon {...p}><circle cx="6" cy="17" r="3.5"/><circle cx="18" cy="17" r="3.5"/><path d="M6 17 10 8h4l4 9M10 8 8 5H6M13 8l3 5"/></Icon>;
const CalendarPlus = (p) => <Icon {...p}><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M12 14v4M10 16h4"/></Icon>;
const Lock = (p) => <Icon {...p}><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></Icon>;
const Pencil = (p) => <Icon {...p}><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></Icon>;
const Ban = (p) => <Icon {...p}><circle cx="12" cy="12" r="9"/><path d="m5.6 5.6 12.8 12.8"/></Icon>;
const Undo = (p) => <Icon {...p}><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></Icon>;
const HelpCircle = (p) => <Icon {...p}><circle cx="12" cy="12" r="9"/><path d="M9.5 9.2a2.6 2.6 0 0 1 5 .9c0 1.7-2.5 2.2-2.5 3.9"/><path d="M12 17.2h.01"/></Icon>;
const UsersIcon = (p) => <Icon {...p}><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6.5 6.5 0 0 1 3.5 6"/></Icon>;
const KindIcon = ({ type, size = 16 }) => (type === "vtt" ? <Bike size={size} /> : <RoadIcon size={size} />);

/* ---------- Petits composants ---------- */
const inputCls = "w-full rounded-lg border border-[#D8D2C1] px-3 py-2 text-[16px] bg-white text-[#1B2430]";
const btnPrimary = "rounded-xl bg-[#C1652F] text-white font-bold text-[14px] py-2.5 px-4 shadow-sm";
const btnGhost = "rounded-xl border-2 border-[#D8D2C1] bg-white text-[#1B2430] font-bold text-[14px] py-2 px-3";

function Badge({ children, color }) {
  return (
    <span style={{ background: color + "1A", color, border: `1px solid ${color}66` }}
          className="inline-flex items-center gap-1 rounded-full px-2.5 py-0.5 text-[11px] font-semibold tracking-wide whitespace-nowrap">
      {children}
    </span>
  );
}
function CoverageBar({ inscrits, besoin }) {
  if (!besoin) return null;
  const ratio = Math.min(inscrits / besoin, 1);
  const full = inscrits >= besoin;
  return (
    <div className="flex items-center gap-2 shrink-0">
      <div className="h-1.5 w-14 rounded-full bg-[#E7E1D3] overflow-hidden">
        <div className="h-full rounded-full" style={{ width: `${ratio * 100}%`, background: full ? "#4E7A51" : "#C1652F" }} />
      </div>
      <span className="text-[12px] font-bold" style={{ color: full ? "#4E7A51" : "#C1652F" }}>{inscrits}/{besoin}</span>
    </div>
  );
}
function Chips({ options, value, onChange }) {
  return (
    <div className="flex gap-1.5 overflow-x-auto pb-1 mb-3">
      {options.map((o) => {
        const on = value === o.id;
        const color = o.color || "#1B2430";
        return (
          <button key={o.id} onClick={() => onChange(o.id)}
            className="shrink-0 rounded-full px-3 py-1.5 text-[12.5px] font-bold border"
            style={on ? { background: color, color: "white", borderColor: color } : { background: "white", color: "#5B5648", borderColor: "#E2DBC9" }}>
            {o.label}
          </button>
        );
      })}
    </div>
  );
}
function Field({ label, children, className = "" }) {
  return (
    <label className={"block " + className}>
      <span className="block text-[11.5px] font-bold text-[#8A8371] uppercase tracking-wide mb-1">{label}</span>
      {children}
    </label>
  );
}
const groupByDate = (list) => list.reduce((acc, s) => { (acc[s.date] = acc[s.date] || []).push(s); return acc; }, {});

/* =====================================================================
   ESPACE ENCADRANT
   ===================================================================== */
function UserSlotCard({ s, me, byId, open, onToggle, onRegister, onUnregister, onExport }) {
  const ci = catInfo(catsOf(s)[0]);
  const mine = presents(s).includes(me);
  const amRef = isRefOf(s, me);
  const st = slotStatus(s);
  const refs = refNames(s, byId);
  const ref = refs.join(" et ") || "À définir";
  const names = presents(s).map((id) => byId[id] && (byId[id].name + (isRefOf(s, id) ? " (réf.)" : ""))).filter(Boolean);
  const vac = vacancesFor(s.date);
  return (
    <div className={"rounded-2xl border border-[#E2DBC9] bg-white shadow-sm overflow-hidden " + (st === "annule" ? "opacity-70" : "")}>
      <button onClick={onToggle} className="w-full flex items-center gap-3 px-4 py-3 text-left">
        <div className="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl" style={{ background: ci.color + "1A", color: ci.color }}>
          <KindIcon type={s.type} size={19} />
        </div>
        <div className="flex-1 min-w-0">
          <div className="flex items-center gap-1.5 text-[14px] font-bold text-[#1B2430]">
            <Clock size={13} className="text-[#8A8371]" /> {fmtTime(s.time)}
            <span className="text-[#D8D2C1]">·</span>{s.type === "vtt" ? "VTT" : "Route"}
          </div>
          <p className="text-[12.5px] text-[#8A8371] truncate mt-0.5">{catsLabel(s)} — {s.lieu}</p>
        </div>
        {st === "annule"
          ? <Badge color="#B03A2E">Annulé</Badge>
          : mine
            ? <span className="flex items-center gap-1 text-[12px] font-bold text-[#4E7A51] shrink-0"><Check size={14} /> Inscrit</span>
            : <CoverageBar inscrits={presents(s).length} besoin={s.besoin} />}
      </button>
      {open && (
        <div className="border-t border-[#EEE8DA] px-4 py-3 bg-[#FBF9F3]">
          <div className="flex items-center gap-1.5 text-[13px] text-[#5B5648] mb-1"><MapPin size={13} /> {s.lieu}</div>
          <div className="flex items-center gap-1.5 text-[13px] text-[#5B5648] mb-1"><Clock size={13} /> {fmtTime(s.time)} – {endTime(s)}</div>
          <div className="flex items-center gap-1.5 text-[13px] text-[#5B5648] mb-1"><ShieldCheck size={13} /> {refs.length > 1 ? "Référents" : "Référent"} : {ref}</div>
          {s.participants != null && <div className="flex items-center gap-1.5 text-[13px] text-[#5B5648] mb-1"><UsersIcon size={13} /> {s.participants} jeune{s.participants > 1 ? "s" : ""} attendu{s.participants > 1 ? "s" : ""}</div>}
          {vac && <div className="mb-1"><Badge color="#2F6690">Vacances scolaires · {vac.label}</Badge></div>}
          {s.note && <p className="text-[13px] text-[#B03A2E] font-semibold mb-1">{s.note}</p>}
          <p className="text-[11.5px] font-bold text-[#8A8371] mt-2 mb-1.5 uppercase tracking-wide">Encadrants présents ({presents(s).length}/{s.besoin}, référents inclus)</p>
          <div className="flex flex-wrap gap-1.5 mb-3">
            {names.length === 0 && <span className="text-[13px] text-[#C1652F] font-medium">Personne pour l'instant</span>}
            {names.map((n) => <span key={n} className="rounded-full bg-white border border-[#E2DBC9] px-2.5 py-1 text-[12px] text-[#1B2430] font-medium">{n}</span>)}
          </div>
          {st === "annule" ? (
            <p className="text-[13px] font-bold text-[#B03A2E]">Créneau annulé</p>
          ) : mine ? (
            <div className="flex flex-col gap-2">
              <button onClick={onExport} className={btnPrimary + " flex items-center justify-center gap-2"}><CalendarPlus size={16} /> Ajouter à mon agenda</button>
              {amRef
                ? <p className="text-[12.5px] text-[#5B5648] text-center">Tu es référent de ce créneau.</p>
                : <button onClick={onUnregister} className={btnGhost}>Me désinscrire</button>}
            </div>
          ) : st === "complet" ? (
            <p className="text-[13px] font-bold text-[#8A8371]">Créneau complet</p>
          ) : (
            <button onClick={onRegister} className={btnPrimary + " w-full"}>Je suis disponible</button>
          )}
        </div>
      )}
    </div>
  );
}


function UrgentBanner({ sorties, onOpen }) {
  const list = useMemo(() => urgentSlots(sorties), [sorties]);
  const [copied, setCopied] = useState(false);
  if (list.length === 0) return null;
  const txt = shareText(list);
  const whatsapp = () => window.open("https://wa.me/?text=" + encodeURIComponent(txt), "_blank");
  const copy = async () => {
    try { await navigator.clipboard.writeText(txt); setCopied(true); setTimeout(() => setCopied(false), 2500); }
    catch (e) { window.prompt("Copie ce message :", txt); }
  };
  return (
    <div className="rounded-2xl border-2 border-[#B03A2E] bg-[#FCEDEA] px-4 py-3 mb-4">
      <div className="flex items-center gap-1.5 text-[13px] font-bold text-[#B03A2E] uppercase tracking-wide mb-2">
        <AlertTriangle size={15} /> Urgent · il manque du monde ({list.length})
      </div>
      <div className="flex flex-col gap-1.5 mb-3">
        {list.map((s) => (
          <button key={s.id} onClick={onOpen ? () => onOpen(s) : undefined}
            className="text-left text-[13.5px] text-[#1B2430] leading-snug">
            <span className="font-bold">{fmtDate(s.date)} {fmtTime(s.time)}</span> · {catsLabel(s)} · {s.lieu}
            <span className="font-bold text-[#B03A2E]"> — manque {manque(s)}</span>
          </button>
        ))}
      </div>
      <div className="flex gap-2">
        <button onClick={whatsapp} className="flex-1 rounded-xl bg-[#1FA855] text-white font-bold text-[13.5px] py-2">Partager sur WhatsApp</button>
        <button onClick={copy} className={btnGhost + " !py-2 !text-[13px]"}>{copied ? "Copié ✓" : "Copier"}</button>
      </div>
    </div>
  );
}

function UserView({ data, actions, me, setIdentity, byId }) {
  const [tab, setTab] = useState("libres");
  const [month, setMonth] = useState(null);
  const [cat, setCat] = useState("all");
  const [openId, setOpenId] = useState(null);
  const [toast, setToast] = useState(null);

  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), 9000);
    return () => clearTimeout(t);
  }, [toast]);

  const upcoming = useMemo(() => data.sorties.filter(isUpcoming).sort(sortSlots), [data.sorties]);
  const mineAll = useMemo(() => data.sorties.filter((s) => me && presents(s).includes(me)), [data.sorties, me]);
  const libres = useMemo(
    () => upcoming.filter((s) =>
      s.besoin > 0 && presents(s).length < s.besoin && !(me && presents(s).includes(me)) &&
      !mineAll.some((m) => m.besoin > 0 && overlaps(m, s))),
    [upcoming, mineAll, me]
  );
  const mes = useMemo(() => upcoming.filter((s) => me && presents(s).includes(me)), [upcoming, me]);

  if (!me) {
    const sorted = [...data.encadrants].sort((a, b) => a.name.localeCompare(b.name));
    return (
      <div className="px-5 pt-6 pb-10 max-w-md mx-auto">
        <h2 className="font-display text-[26px] leading-tight text-[#1B2430]">Qui se connecte&nbsp;?</h2>
        <p className="text-[14px] text-[#5B5648] mt-1 mb-5">Choisis ton nom dans la liste des encadrants du club.</p>
        <div className="flex flex-col gap-2">
          {sorted.map(({ id, name, niveau }) => (
            <button key={id} onClick={() => setIdentity(id)}
              className="w-full flex items-center gap-3 rounded-2xl border border-[#E2DBC9] bg-white px-4 py-3 text-left shadow-sm active:scale-[0.99] transition-transform">
              <UserCircle2 size={24} className="text-[#B0A98F] shrink-0" />
              <span className="text-[15px] font-semibold text-[#1B2430] flex-1">{name}</span>
              <Badge color={NIVEAU_COLOR[niveau] || "#8A8371"}>{niveau}</Badge>
            </button>
          ))}
        </div>
      </div>
    );
  }

  const base = tab === "libres" ? libres : mes;
  const catFiltered = cat === "all" ? base : base.filter((s) => hasCat(s, cat));
  const months = [...new Set(catFiltered.map((s) => monthKey(s.date)))];
  const fallback = tab === "mes" ? "all" : months[0] || "all";
  const monthSel = month === "all" || (month && months.includes(month)) ? month : fallback;
  const visible = monthSel === "all" ? catFiltered : catFiltered.filter((s) => monthKey(s.date) === monthSel);
  const groups = groupByDate(visible);

  const register = async (s) => {
    try { await actions.register(s.id, me); setToast({ slot: s }); }
    catch (e) { setToast({ error: e.message }); }
    setOpenId(null);
  };
  const unregister = async (s) => {
    try { await actions.unregister(s.id, me); }
    catch (e) { setToast({ error: e.message }); }
    setOpenId(null);
  };
  const exportOne = (s) => downloadICS([s], byId, `bftri-${s.date}-${catsOf(s).join("-")}.ics`);
  const switchTab = (t) => { setTab(t); setMonth(null); setOpenId(null); };

  return (
    <div className="px-5 pt-5 pb-28 max-w-md mx-auto">
      <div className="flex items-center justify-between mb-4">
        <div>
          <p className="text-[11px] uppercase tracking-wide text-[#8A8371] font-bold">Connecté</p>
          <p className="font-display text-[20px] text-[#1B2430]">{byId[me].name}</p>
        </div>
        <button onClick={() => setIdentity(null)} className="text-[13px] text-[#C1652F] font-bold">Changer</button>
      </div>

      <UrgentBanner sorties={data.sorties} onOpen={(s) => { setTab("libres"); setCat("all"); setMonth("all"); setOpenId(s.id); }} />

      <div className="flex rounded-xl bg-[#EEE8DA] p-1 mb-4">
        {[{ id: "libres", label: `À pourvoir (${libres.length})` }, { id: "mes", label: `Mes créneaux (${mes.length})` }].map((t) => (
          <button key={t.id} onClick={() => switchTab(t.id)}
            className={"flex-1 rounded-lg py-2 text-[13px] font-bold " + (tab === t.id ? "bg-white text-[#1B2430] shadow-sm" : "text-[#8A8371]")}>
            {t.label}
          </button>
        ))}
      </div>

      <Chips value={cat} onChange={setCat} options={[{ id: "all", label: "Tous les groupes" }, ...CATEGORIES]} />
      {months.length > 0 && (
        <Chips value={monthSel} onChange={setMonth}
          options={[{ id: "all", label: "Toute la saison" }, ...months.map((m) => ({ id: m, label: monthLabel(m) }))]} />
      )}

      {tab === "mes" && mes.some((s) => s.besoin > 0) && (
        <button onClick={() => downloadICS(mes.filter((s) => s.besoin > 0), byId, "bftri-mes-creneaux.ics")}
          className={btnGhost + " w-full flex items-center justify-center gap-2 mb-4"}>
          <CalendarPlus size={16} /> Exporter tous mes créneaux vers l'agenda
        </button>
      )}

      {visible.length === 0 && (
        <div className="rounded-2xl border border-dashed border-[#D8D2C1] bg-white px-4 py-8 text-center text-[14px] text-[#8A8371]">
          {tab === "libres" ? "Aucun créneau à pourvoir avec ces filtres." : "Tu n'es positionné sur aucun créneau à venir."}
        </div>
      )}

      {Object.entries(groups).map(([date, list]) => (
        <div key={date} className="mb-6">
          <h3 className="font-display text-[17px] text-[#1B2430] mb-2.5">{fmtDateYear(date)}</h3>
          <div className="flex flex-col gap-2.5">
            {list.map((s) => (
              <UserSlotCard key={s.id} s={s} me={me} byId={byId} open={openId === s.id}
                onToggle={() => setOpenId(openId === s.id ? null : s.id)}
                onRegister={() => register(s)} onUnregister={() => unregister(s)} onExport={() => exportOne(s)} />
            ))}
          </div>
        </div>
      ))}

      {toast && toast.error && (
        <div className="fixed bottom-4 left-1/2 -translate-x-1/2 w-[calc(100%-2rem)] max-w-md z-20 rounded-2xl bg-[#B03A2E] text-white shadow-lg px-4 py-3 flex items-center gap-3">
          <p className="text-[13.5px] font-semibold flex-1">{toast.error}</p>
          <button onClick={() => setToast(null)} className="rounded-lg bg-white/20 px-3 py-2 text-[13px] font-bold">OK</button>
        </div>
      )}
      {toast && toast.slot && (
        <div className="fixed bottom-4 left-1/2 -translate-x-1/2 w-[calc(100%-2rem)] max-w-md z-20 rounded-2xl bg-[#1B2430] text-white shadow-lg px-4 py-3">
          <p className="text-[13.5px] font-semibold mb-2">
            Inscription enregistrée · {fmtDate(toast.slot.date)} {fmtTime(toast.slot.time)}
          </p>
          <div className="flex gap-2">
            <button onClick={() => exportOne(toast.slot)} className="flex-1 rounded-lg bg-[#C1652F] py-2 text-[13px] font-bold flex items-center justify-center gap-1.5">
              <CalendarPlus size={15} /> Ajouter à mon agenda
            </button>
            <button onClick={() => setToast(null)} className="rounded-lg bg-white/10 px-3 py-2 text-[13px] font-bold">OK</button>
          </div>
        </div>
      )}
    </div>
  );
}

function AdminGate({ onOK }) {
  const [pwd, setPwd] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const submit = async (e) => {
    e.preventDefault();
    setBusy(true);
    try { const r = await api("admin/login", { password: pwd }); setToken(r.token); onOK(); }
    catch (x) { setErr(x.message); }
    setBusy(false);
  };
  return (
    <form onSubmit={submit} className="px-5 pt-8 pb-10 max-w-md mx-auto">
      <div className="flex h-12 w-12 items-center justify-center rounded-2xl bg-[#1B2430] text-white mb-4"><Lock size={22} /></div>
      <h2 className="font-display text-[24px] text-[#1B2430]">Accès administrateur</h2>
      <p className="text-[14px] text-[#5B5648] mt-1 mb-5">Saisis le mot de passe pour gérer les créneaux, les vacances et les encadrants.</p>
      <input type="password" autoComplete="current-password" placeholder="Mot de passe" value={pwd}
        onChange={(e) => { setPwd(e.target.value); setErr(""); }} className={inputCls + " mb-2"} />
      {err && <p className="text-[13px] font-bold text-[#B03A2E] mb-2">{err}</p>}
      <button type="submit" disabled={busy} className={btnPrimary + " w-full mt-1 disabled:opacity-60"}>{busy ? "Vérification…" : "Se connecter"}</button>
    </form>
  );
}

function SlotForm({ title, initial, encadrants, lieux, dateMin, dateMax, submitLabel, onSave, onCancel }) {
  const [f, setF] = useState(() => ({ ...initial, cats: catsOf(initial) }));
  const [err, setErr] = useState("");
  const set = (k, v) => setF((prev) => ({ ...prev, [k]: v }));
  const isNew = !f.id;
  const toggleCat = (id) => setF((prev) => {
    const has = prev.cats.includes(id);
    if (has && prev.cats.length === 1) return prev; // au moins un groupe
    const cats = CATEGORIES.map((c) => c.id).filter((c) => (c === id ? !has : prev.cats.includes(c)));
    return { ...prev, cats, type: canRoute(cats) ? prev.type : "vtt", ...(isNew ? slotDefaults(cats, prev.date, encadrants) : {}) };
  });
  const setDate = (date) => setF((prev) => ({ ...prev, date, ...(isNew && date ? slotDefaults(prev.cats, date, encadrants) : {}) }));
  const sortedEnc = [...encadrants].sort((a, b) => a.name.localeCompare(b.name));
  const [busy, setBusy] = useState(false);
  const submit = async () => {
    if (!f.date || !f.time || !String(f.lieu).trim()) { setErr("Date, heure et lieu sont obligatoires."); return; }
    if (f.besoin === "" || f.besoin == null) { setErr("Indique le nombre d'encadrants (0 pour annuler le créneau)."); return; }
    setBusy(true);
    try { await onSave({
      ...f,
      cats: f.cats,
      lieu: String(f.lieu).trim(),
      duree: parseInt(f.duree, 10) || 120,
      besoin: Math.max(0, parseInt(f.besoin, 10) || 0),
      participants: f.participants === "" || f.participants == null ? null : Math.max(0, parseInt(f.participants, 10) || 0),
      referent: f.referent || null,
      referent2: f.referent2 || null,
      note: String(f.note || "").trim(),
    }); } catch (e) { setErr(e.message); setBusy(false); }
  };
  return (
    <div className="rounded-2xl border border-[#E2DBC9] bg-[#FBF9F3] p-4">
      <div className="flex items-center justify-between mb-3">
        <p className="font-display text-[16px] text-[#1B2430]">{title}</p>
        <button onClick={onCancel} aria-label="Fermer"><XIcon size={18} className="text-[#8A8371]" /></button>
      </div>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Date" className="col-span-2">
          <input type="date" value={f.date} min={dateMin} max={dateMax} onChange={(e) => setDate(e.target.value)} className={inputCls} />
        </Field>
        <Field label="Heure"><input type="time" value={f.time} onChange={(e) => set("time", e.target.value)} className={inputCls} /></Field>
        <Field label="Durée (min)"><input type="number" min="15" step="15" value={f.duree} onChange={(e) => set("duree", e.target.value)} className={inputCls} /></Field>
        <Field label="Groupes concernés" className="col-span-2">
          <div className="flex flex-wrap gap-2">
            {CATEGORIES.map((c) => {
              const on = f.cats.includes(c.id);
              return (
                <button type="button" key={c.id} onClick={() => toggleCat(c.id)} aria-pressed={on}
                  className={"rounded-full border-2 px-3 py-1.5 text-[13px] font-bold " + (on ? "text-white" : "bg-white text-[#5B5648] border-[#D8D2C1]")}
                  style={on ? { background: c.color, borderColor: c.color } : undefined}>
                  {on ? "✓ " : ""}{c.label}
                </button>
              );
            })}
          </div>
          <span className="block text-[11.5px] text-[#8A8371] mt-1">Plusieurs groupes possibles pour une même sortie (ex. Poussin + Pupille).</span>
        </Field>
        <Field label="Type" className="col-span-2">
          <select value={f.type} onChange={(e) => set("type", e.target.value)} className={inputCls}>
            <option value="vtt">VTT</option>
            {canRoute(f.cats) && <option value="route">Route</option>}
          </select>
          {!canRoute(f.cats) && <span className="block text-[11.5px] text-[#8A8371] mt-1">Seuls les groupes Compet et Benjamin sortent en Route.</span>}
        </Field>
        <Field label="Lieu de rendez-vous" className="col-span-2">
          <input list="lieux-list" value={f.lieu} onChange={(e) => set("lieu", e.target.value)} placeholder="Choisis ou saisis un lieu" className={inputCls} />
          <datalist id="lieux-list">{(lieux || []).map((l) => <option key={l} value={l} />)}</datalist>
        </Field>
        <Field label="Référent 1" className="col-span-2">
          <select value={f.referent || ""} onChange={(e) => set("referent", e.target.value)} className={inputCls}>
            <option value="">À définir</option>
            {sortedEnc.map((e) => <option key={e.id} value={e.id}>{e.name}</option>)}
          </select>
        </Field>
        <Field label="Référent 2" className="col-span-2">
          <select value={f.referent2 || ""} onChange={(e) => set("referent2", e.target.value)} className={inputCls}>
            <option value="">À définir</option>
            {sortedEnc.map((e) => <option key={e.id} value={e.id}>{e.name}</option>)}
          </select>
        </Field>
        <Field label="Encadrants requis (référents inclus)">
          <input type="number" min="0" value={f.besoin} onChange={(e) => set("besoin", e.target.value)} className={inputCls} />
        </Field>
        <Field label="Jeunes attendus">
          <input type="number" min="0" value={f.participants == null ? "" : f.participants} onChange={(e) => set("participants", e.target.value)} placeholder="—" className={inputCls} />
        </Field>
        <p className="col-span-2 text-[11.5px] text-[#8A8371] -mt-1">Mettre 0 encadrant requis annule le créneau : il devient inaccessible aux encadrants.</p>
        <Field label="Note (optionnel)" className="col-span-2">
          <input value={f.note || ""} onChange={(e) => set("note", e.target.value)} placeholder="Ex. stage, sortie exceptionnelle…" className={inputCls} />
        </Field>
      </div>
      {err && <p className="text-[13px] font-bold text-[#B03A2E] mt-3">{err}</p>}
      <button onClick={submit} disabled={busy} className="w-full rounded-xl bg-[#1B2430] text-white py-2.5 text-[14px] font-bold mt-4 disabled:opacity-60">{busy ? "Enregistrement…" : submitLabel}</button>
    </div>
  );
}

function AdminSlotCard({ s, byId, onEdit, onToggleCancel, onDelete }) {
  const [confirmDel, setConfirmDel] = useState(false);
  const ci = catInfo(catsOf(s)[0]);
  const annule = s.besoin === 0;
  const missing = s.besoin - presents(s).length;
  const refs = refNames(s, byId);
  const ref = refs.join(" et ") || "À définir";
  const names = s.inscrits.map((id) => byId[id] && byId[id].name).filter(Boolean);
  const vac = vacancesFor(s.date);
  return (
    <div className={"rounded-2xl border border-[#E2DBC9] bg-white shadow-sm p-4 " + (annule ? "opacity-75" : "")}>
      <div className="flex items-start justify-between mb-2 gap-2">
        <div>
          <div className="flex items-center gap-1.5 text-[14px] font-bold text-[#1B2430]">
            {fmtDate(s.date)} <span className="text-[#D8D2C1]">·</span> {fmtTime(s.time)}–{endTime(s)}
          </div>
          <div className="flex flex-wrap items-center gap-1.5 mt-1.5">
            <Badge color={ci.color}>{catsLabel(s)}</Badge>
            <span className="flex items-center gap-1 text-[12px] text-[#5B5648] font-medium"><KindIcon type={s.type} size={12} /> {s.type === "vtt" ? "VTT" : "Route"}</span>
            {vac && <Badge color="#2F6690">Vacances</Badge>}
          </div>
        </div>
        {annule ? <Badge color="#B03A2E">Annulé</Badge> : <CoverageBar inscrits={presents(s).length} besoin={s.besoin} />}
      </div>
      <div className="text-[12.5px] text-[#5B5648] flex items-center gap-1.5 mb-0.5"><MapPin size={12} /> {s.lieu}</div>
      <div className="text-[12.5px] text-[#5B5648] flex items-center gap-1.5 mb-0.5"><ShieldCheck size={12} /> {refs.length > 1 ? "Référents" : "Référent"} : {ref}</div>
      {s.participants != null && <div className="text-[12.5px] text-[#5B5648] flex items-center gap-1.5 mb-0.5"><UsersIcon size={12} /> {s.participants} jeune{s.participants > 1 ? "s" : ""}</div>}
      {s.note && <div className="text-[12.5px] text-[#B03A2E] font-semibold mb-0.5">{s.note}</div>}
      <div className="flex flex-wrap gap-1.5 mt-2">
        {names.map((n) => <span key={n} className="rounded-full bg-[#F3EEE3] px-2 py-0.5 text-[11.5px] text-[#1B2430] font-medium">{n}</span>)}
        {!annule && missing > 0 && <span className="rounded-full bg-[#FBEEE4] px-2 py-0.5 text-[11.5px] text-[#C1652F] font-bold">{missing} manquant{missing > 1 ? "s" : ""}</span>}
      </div>
      <div className="flex gap-2 mt-3">
        <button onClick={onEdit} className={btnGhost + " flex-1 flex items-center justify-center gap-1.5"}><Pencil size={14} /> Modifier</button>
        <button onClick={onToggleCancel} className={btnGhost + " flex-1 flex items-center justify-center gap-1.5 " + (annule ? "" : "text-[#B03A2E]")}>
          {annule ? <><Undo size={14} /> Rétablir</> : <><Ban size={14} /> Annuler</>}
        </button>
      </div>
      {onDelete && (confirmDel ? (
        <div className="mt-2 rounded-xl bg-[#FBEEE9] border border-[#B03A2E]/30 p-3">
          <p className="text-[12.5px] text-[#B03A2E] font-semibold mb-2">
            Supprimer définitivement ce créneau{s.inscrits.length > 0 ? ` et désinscrire ${s.inscrits.length} encadrant${s.inscrits.length > 1 ? "s" : ""}` : ""} ?
          </p>
          <div className="flex gap-2">
            <button onClick={onDelete} className="flex-1 rounded-lg bg-[#B03A2E] text-white py-2 text-[13px] font-bold">Supprimer</button>
            <button onClick={() => setConfirmDel(false)} className={btnGhost + " flex-1"}>Garder</button>
          </div>
        </div>
      ) : (
        <button onClick={() => setConfirmDel(true)} className="mt-2 w-full text-[12.5px] font-bold text-[#B03A2E] py-1.5">Supprimer le créneau</button>
      ))}
    </div>
  );
}

  participants: "", note: "", inscrits: [],

  const catFiltered = cat === "all" ? list : list.filter((s) => hasCat(s, cat));
  const months = [...new Set(catFiltered.map((s) => monthKey(s.date)))];

        <div className="flex items-center gap-1.5 text-[13px] text-[#C1652F] font-bold mb-3">
          <AlertTriangle size={14} /> {understaffed} créneau{understaffed > 1 ? "x" : ""} à compléter
        </div>
      )}
      <Chips value={cat} onChange={setCat} options={[{ id: "all", label: "Tous les groupes" }, ...CATEGORIES]} />
      <Chips value={monthSel} onChange={setMonth} options={[{ id: "all", label: "Toute la saison" }, ...months.map((m) => ({ id: m, label: monthLabel(m) }))]} />
      <label className="flex items-center gap-2 text-[13px] text-[#5B5648] mb-4">
        <input type="checkbox" checked={showPast} onChange={(e) => setShowPast(e.target.checked)} className="h-4 w-4" /> Afficher les créneaux passés
      </label>

      {editing === "new" ? (
        <div className="mb-5">
          <SlotForm title="Nouveau créneau" initial={newSlotDefaults(todayISO, data.encadrants)} encadrants={data.encadrants} lieux={data.lieux} submitLabel="Créer le créneau"
            onCancel={() => setEditing(null)} onSave={async (v) => { await create(v); setEditing(null); }} />
        </div>
      ) : (
        <button onClick={() => setEditing("new")}
          className="w-full flex items-center justify-center gap-1.5 rounded-xl border-2 border-dashed border-[#C1652F] text-[#C1652F] py-3 text-[14px] font-bold mb-5">
          <Plus size={16} /> Ajouter un créneau
        </button>
      )}

      {visible.length === 0 && <p className="text-[14px] text-[#8A8371] text-center py-6">Aucun créneau avec ces filtres.</p>}
      {Object.entries(groups).map(([date, slots]) => (
        <div key={date} className="mb-5">
          <h3 className="font-display text-[16px] text-[#1B2430] mb-2">{fmtDateYear(date)}</h3>
          <div className="flex flex-col gap-2.5">
            {slots.map((s) => editing === s.id ? (
              <SlotForm key={s.id} title="Modifier le créneau" initial={s} encadrants={data.encadrants} lieux={data.lieux} submitLabel="Enregistrer"
                onCancel={() => setEditing(null)} onSave={async (v) => { await save(s.id, v); setEditing(null); }} />
            ) : (
              <AdminSlotCard key={s.id} s={s} byId={byId} onEdit={() => setEditing(s.id)} onToggleCancel={() => toggleCancel(s)} onDelete={() => actions.removeSlot(s.id)} />
            ))}
          </div>
        </div>
      ))}
    </div>
  );
}

function AdminVacances({ data, actions, byId }) {
  const [editing, setEditing] = useState(null);
  const { save, create, toggleCancel } = actions;
  return (
    <div>
      <h2 className="font-display text-[21px] text-[#1B2430] mb-1">Vacances scolaires</h2>
      <p className="text-[13px] text-[#5B5648] mb-4">
        Zone C (Créteil – Seine-et-Marne), saison 2026-2027. Les vacances démarrent le samedi soir : le premier samedi reste un entraînement normal. Aucun entraînement régulier n'est ensuite programmé pendant ces périodes :
        ajoute ici les créneaux particuliers (stages, sorties exceptionnelles).
      </p>
      {VACANCES.map((v) => {
        const slots = data.sorties.filter((s) => vacancesFor(s.date) === v).sort(sortSlots);
        const groups = groupByDate(slots);
        const newKey = v.id + ":new";
        return (
          <div key={v.id} className="mb-7">
            <div className="rounded-2xl bg-[#1B2430] text-white px-4 py-3 mb-3">
              <p className="font-display text-[17px]">{v.label}</p>
              <p className="text-[12.5px] text-white/70">du {fmtDate(v.debut)} (le soir) au {fmtDate(v.fin)} {parseISO(v.fin).getFullYear()}</p>
            </div>
            {slots.length === 0 && <p className="text-[13px] text-[#8A8371] mb-3">Aucun créneau particulier sur cette période.</p>}
            {Object.entries(groups).map(([date, list]) => (
              <div key={date} className="mb-4">
                <h3 className="font-display text-[15px] text-[#1B2430] mb-2">{fmtDateYear(date)}</h3>
                <div className="flex flex-col gap-2.5">
                  {list.map((s) => editing === s.id ? (
                    <SlotForm key={s.id} title="Modifier le créneau" initial={s} encadrants={data.encadrants} lieux={data.lieux} dateMin={nextDay(v.debut)} dateMax={v.fin}
                      submitLabel="Enregistrer" onCancel={() => setEditing(null)} onSave={async (vals) => { await save(s.id, vals); setEditing(null); }} />
                  ) : (
                    <AdminSlotCard key={s.id} s={s} byId={byId} onEdit={() => setEditing(s.id)} onToggleCancel={() => toggleCancel(s)} onDelete={() => actions.removeSlot(s.id)} />
                  ))}
                </div>
              </div>
            ))}
            {editing === newKey ? (
              <SlotForm title={"Nouveau créneau · " + v.label} initial={newSlotDefaults(nextDay(v.debut), data.encadrants)} encadrants={data.encadrants} lieux={data.lieux}
                dateMin={nextDay(v.debut)} dateMax={v.fin} submitLabel="Créer le créneau"
                onCancel={() => setEditing(null)} onSave={async (vals) => { await create(vals); setEditing(null); }} />
            ) : (
              <button onClick={() => setEditing(newKey)}
                className="w-full flex items-center justify-center gap-1.5 rounded-xl border-2 border-dashed border-[#2F6690] text-[#2F6690] py-3 text-[14px] font-bold">
                <Plus size={16} /> Ajouter un créneau pendant ces vacances
              </button>
            )}
          </div>
        );
      })}
    </div>
  );
}

function AdminEncadrants({ data, actions }) {
  const { addEncadrant, removeEncadrant } = actions;
  const [name, setName] = useState("");
  const [niveau, setNiveau] = useState("Bénévole");
  const [err, setErr] = useState("");
  const [confirmId, setConfirmId] = useState(null);
  const [editId, setEditId] = useState(null);
  const [editName, setEditName] = useState("");
  const [editErr, setEditErr] = useState("");
  const startEdit = (e) => { setEditId(e.id); setEditName(e.name); setEditErr(""); setConfirmId(null); };
  const saveEdit = async () => {
    const n = editName.trim().replace(/\s+/g, " ");
    if (!n) { setEditErr("Indique un nom."); return; }
    try { await actions.renameEncadrant(editId, n); setEditId(null); setEditErr(""); } catch (e) { setEditErr(e.message); }
  };
  const add = async () => {
    const n = name.trim();
    if (!n) { setErr("Indique un nom."); return; }
    if (data.encadrants.some((e) => e.name.toLowerCase() === n.toLowerCase())) { setErr("Cette personne existe déjà."); return; }
    try { await addEncadrant(n, niveau); setName(""); setErr(""); } catch (e) { setErr(e.message); }
  };
  const sorted = [...data.encadrants].sort((a, b) => a.name.localeCompare(b.name));
  return (
    <div>
      <h2 className="font-display text-[21px] text-[#1B2430] mb-1">Encadrants ({data.encadrants.length})</h2>
      <p className="text-[13px] text-[#5B5648] mb-4">Les personnes ajoutées apparaissent dans la liste de connexion et peuvent se positionner sur les créneaux.</p>
      <div className="rounded-2xl border border-[#E2DBC9] bg-[#FBF9F3] p-4 mb-5">
        <div className="grid grid-cols-2 gap-3">
          <Field label="Nom et prénom" className="col-span-2"><input value={name} onChange={(e) => { setName(e.target.value); setErr(""); }} placeholder="Prénom Nom" className={inputCls} /></Field>
          <Field label="Niveau" className="col-span-2">
            <select value={niveau} onChange={(e) => setNiveau(e.target.value)} className={inputCls}>{NIVEAUX.map((n) => <option key={n} value={n}>{n}</option>)}</select>
          </Field>
        </div>
        {err && <p className="text-[13px] font-bold text-[#B03A2E] mt-3">{err}</p>}
        <button onClick={add} className="w-full rounded-xl bg-[#1B2430] text-white py-2.5 text-[14px] font-bold mt-4 flex items-center justify-center gap-1.5"><Plus size={16} /> Ajouter l'encadrant</button>
      </div>
      <div className="flex flex-col gap-2">
        {sorted.map((e) => (
          <div key={e.id} className="flex items-center gap-3 rounded-2xl border border-[#E2DBC9] bg-white px-4 py-3 shadow-sm">
            <UserCircle2 size={22} className="text-[#B0A98F] shrink-0" />
            {editId === e.id ? (
              <div className="flex-1 min-w-0">
                <input value={editName} onChange={(ev) => { setEditName(ev.target.value); setEditErr(""); }} autoFocus aria-label={"Nom de " + e.name}
                  onKeyDown={(ev) => { if (ev.key === "Enter") saveEdit(); if (ev.key === "Escape") setEditId(null); }}
                  className={inputCls + " !py-1.5"} />
                {editErr && <p className="text-[12px] font-bold text-[#B03A2E] mt-1">{editErr}</p>}
                <div className="flex gap-3 mt-1.5">
                  <button onClick={saveEdit} className="text-[12px] font-bold text-white bg-[#1B2430] rounded-lg px-2.5 py-1.5">Enregistrer</button>
                  <button onClick={() => setEditId(null)} className="text-[12px] font-bold text-[#8A8371]">Annuler</button>
                </div>
              </div>
            ) : (
              <>
                <span className="text-[14.5px] font-semibold text-[#1B2430] flex-1">{e.name}</span>
                <button onClick={() => startEdit(e)} className="text-[12px] font-bold text-[#C1652F]">Renommer</button>
              </>
            )}
            {editId !== e.id && <select value={e.niveau} onChange={(ev) => actions.updateNiveau(e.id, ev.target.value)} aria-label={"Niveau de " + e.name}
              className="rounded-lg border border-[#E2DBC9] bg-white text-[12px] font-bold py-1 px-1.5 max-w-[8.5rem]" style={{ color: NIVEAU_COLOR[e.niveau] || "#8A8371" }}>
              {NIVEAUX.map((n) => <option key={n} value={n}>{n}</option>)}
            </select>}
            {editId !== e.id && (confirmId === e.id ? (
              <button onClick={() => { removeEncadrant(e.id); setConfirmId(null); }} className="text-[12px] font-bold text-white bg-[#B03A2E] rounded-lg px-2.5 py-1.5">Confirmer</button>
            ) : (
              <button onClick={() => setConfirmId(e.id)} className="text-[12px] font-bold text-[#B03A2E]">Retirer</button>
            ))}
          </div>
        ))}
      </div>
      <p className="text-[11.5px] text-[#8A8371] mt-3">Retirer une personne la désinscrit aussi de tous ses créneaux.</p>
    </div>
  );
}

function AdminLieux({ data, actions }) {
  const lieux = data.lieux || [];
  const [name, setName] = useState("");
  const [err, setErr] = useState("");
  const [editName, setEditName] = useState(null);
  const [editVal, setEditVal] = useState("");
  const [editErr, setEditErr] = useState("");
  const [confirm, setConfirm] = useState(null);
  const usage = (l) => data.sorties.filter((s) => s.lieu === l).length;
  const add = async () => {
    const n = name.trim().replace(/\s+/g, " ");
    if (!n) { setErr("Indique un nom de lieu."); return; }
    if (lieux.some((l) => l.toLowerCase() === n.toLowerCase())) { setErr("Ce lieu existe déjà."); return; }
    try { await actions.addLieu(n); setName(""); setErr(""); } catch (e) { setErr(e.message); }
  };
  const saveEdit = async () => {
    const n = editVal.trim().replace(/\s+/g, " ");
    if (!n) { setEditErr("Indique un nom."); return; }
    try { await actions.renameLieu(editName, n); setEditName(null); setEditErr(""); } catch (e) { setEditErr(e.message); }
  };
  return (
    <div>
      <h2 className="font-display text-[21px] text-[#1B2430] mb-1">Lieux ({lieux.length})</h2>
      <p className="text-[13px] text-[#5B5648] mb-4">Ces lieux sont proposés quand tu crées ou modifies un créneau. Les créneaux déjà créés gardent leur lieu.</p>
      <div className="rounded-2xl border border-[#E2DBC9] bg-[#FBF9F3] p-4 mb-5">
        <Field label="Nouveau lieu de rendez-vous">
          <input value={name} onChange={(e) => { setName(e.target.value); setErr(""); }} onKeyDown={(e) => { if (e.key === "Enter") add(); }} placeholder="Ex. Parking Decathlon Pontault" className={inputCls} />
        </Field>
        {err && <p className="text-[13px] font-bold text-[#B03A2E] mt-3">{err}</p>}
        <button onClick={add} className="w-full rounded-xl bg-[#1B2430] text-white py-2.5 text-[14px] font-bold mt-4 flex items-center justify-center gap-1.5"><Plus size={16} /> Ajouter le lieu</button>
      </div>
      <div className="flex flex-col gap-2">
        {lieux.map((l) => (
          <div key={l} className="flex items-center gap-3 rounded-2xl border border-[#E2DBC9] bg-white px-4 py-3 shadow-sm">
            <MapPin size={20} className="text-[#B0A98F] shrink-0" />
            {editName === l ? (
              <div className="flex-1 min-w-0">
                <input value={editVal} onChange={(e) => { setEditVal(e.target.value); setEditErr(""); }} autoFocus aria-label={"Nom du lieu " + l}
                  onKeyDown={(e) => { if (e.key === "Enter") saveEdit(); if (e.key === "Escape") setEditName(null); }} className={inputCls + " !py-1.5"} />
                {editErr && <p className="text-[12px] font-bold text-[#B03A2E] mt-1">{editErr}</p>}
                <div className="flex gap-3 mt-1.5">
                  <button onClick={saveEdit} className="text-[12px] font-bold text-white bg-[#1B2430] rounded-lg px-2.5 py-1.5">Enregistrer</button>
                  <button onClick={() => setEditName(null)} className="text-[12px] font-bold text-[#8A8371]">Annuler</button>
                </div>
                <p className="text-[11.5px] text-[#8A8371] mt-1">Le nom est aussi changé sur les créneaux qui l'utilisent.</p>
              </div>
            ) : (
              <>
                <div className="flex-1 min-w-0">
                  <span className="text-[14.5px] font-semibold text-[#1B2430]">{l}</span>
                  <span className="block text-[11.5px] text-[#8A8371]">{usage(l)} créneau{usage(l) > 1 ? "x" : ""}</span>
                </div>
                <button onClick={() => { setEditName(l); setEditVal(l); setEditErr(""); setConfirm(null); }} className="text-[12px] font-bold text-[#C1652F]">Renommer</button>
                {confirm === l ? (
                  <button onClick={() => { actions.removeLieu(l); setConfirm(null); }} className="text-[12px] font-bold text-white bg-[#B03A2E] rounded-lg px-2.5 py-1.5">Confirmer</button>
                ) : (
                  <button onClick={() => setConfirm(l)} className="text-[12px] font-bold text-[#B03A2E]">Retirer</button>
                )}
              </>
            )}
          </div>
        ))}
      </div>
      <p className="text-[11.5px] text-[#8A8371] mt-3">Retirer un lieu ne modifie pas les créneaux existants : il n'est simplement plus proposé.</p>
    </div>
  );
}

function AdminView({ data, actions, byId, onLogout }) {
  const [tab, setTab] = useState("creneaux");
  const tabs = [{ id: "creneaux", label: "Créneaux" }, { id: "vacances", label: "Vacances" }, { id: "encadrants", label: "Encadrants" }, { id: "lieux", label: "Lieux" }];
  return (
    <div className="px-5 pt-5 pb-14 max-w-md mx-auto">
      <div className="flex items-center justify-between mb-3">
        <p className="text-[11px] uppercase tracking-wide text-[#8A8371] font-bold">Administrateur</p>
        <button onClick={onLogout} className="text-[13px] text-[#C1652F] font-bold">Se déconnecter</button>
      </div>
      <div className="flex rounded-xl bg-[#EEE8DA] p-1 mb-5">
        {tabs.map((t) => (
          <button key={t.id} onClick={() => setTab(t.id)}
            className={"flex-1 rounded-lg py-2 text-[13px] font-bold " + (tab === t.id ? "bg-white text-[#1B2430] shadow-sm" : "text-[#8A8371]")}>
            {t.label}
          </button>
        ))}
      </div>
      {tab === "creneaux" && <AdminSlots data={data} actions={actions} byId={byId} />}
      {tab === "vacances" && <AdminVacances data={data} actions={actions} byId={byId} />}
      {tab === "encadrants" && <AdminEncadrants data={data} actions={actions} />}
      {tab === "lieux" && <AdminLieux data={data} actions={actions} />}
    </div>
  );
}

          </div>
          <button onClick={onClose} aria-label="Fermer l'aide" className="rounded-full bg-white border border-[#E2DBC9] p-2 text-[#1B2430]"><XIcon size={18} /></button>
        </div>
        <div className="overflow-y-auto px-5 py-4 flex flex-col gap-2">
          {sections.map((sec, i) => (
            <div key={sec.t} className="shrink-0 rounded-2xl border border-[#E2DBC9] bg-white overflow-hidden">
              <button onClick={() => setOpen(open === i ? -1 : i)} aria-expanded={open === i} className="w-full flex items-center justify-between gap-3 px-4 py-3 text-left">
                <span className="text-[14.5px] font-bold text-[#1B2430]"><span className="text-[#C1652F] mr-2">{i + 1}</span>{sec.t}</span>
                <span className="text-[#8A8371] text-[18px] leading-none">{open === i ? "–" : "+"}</span>
              </button>
              {open === i && <div className="px-4 pb-3 text-[13.5px] leading-relaxed text-[#3D3A30] help-body">{sec.b}</div>}
            </div>
          ))}
          <p className="text-[11.5px] text-[#8A8371] mt-1">Une question ? Contacte un administrateur du club.</p>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [data, setData] = useState(null);
  const [loadErr, setLoadErr] = useState("");
  const [notice, setNotice] = useState("");
  const [mode, setMode] = useState("encadrant");
  const [helpOpen, setHelpOpen] = useState(false);
  const [adminOK, setAdminOK] = useState(() => !!getToken());
  const [identity, setIdentityState] = useState(() => { try { return localStorage.getItem(IDENTITY_KEY); } catch (e) { return null; } });

  const refresh = useCallback(async () => {
    try { const j = await api("state"); setData(j.state); setLoadErr(""); }
    catch (e) { setData((d) => { if (!d) setLoadErr(e.message); return d; }); }
  }, []);
  useEffect(() => {
    refresh();
    const t = setInterval(refresh, 30000);
    const onVis = () => { if (document.visibilityState === "visible") refresh(); };
    document.addEventListener("visibilitychange", onVis);
    return () => { clearInterval(t); document.removeEventListener("visibilitychange", onVis); };
  }, [refresh]);
  useEffect(() => { if (!notice) return; const t = setTimeout(() => setNotice(""), 6000); return () => clearTimeout(t); }, [notice]);

  const call = async (path, body) => {
    try { const j = await api(path, body); setData(j.state); return j; }
    catch (e) {
      if (e.state) setData(e.state);
      if (e.status === 401 && path.startsWith("admin/") && path !== "admin/login") { setToken(null); setAdminOK(false); }
      throw e;
    }
  };
  const quiet = (p) => p.catch((e) => setNotice(e.message));
  const slotPayload = (s, extra) => ({ id: s.id, date: s.date, time: s.time, duree: s.duree, type: s.type, cats: catsOf(s), lieu: s.lieu, referent: s.referent || null, referent2: s.referent2 || null, besoin: s.besoin, participants: s.participants, note: s.note, ...extra });
  const actions = {
    register: (sortieId, encadrantId) => call("register", { sortieId, encadrantId }),
    unregister: (sortieId, encadrantId) => call("unregister", { sortieId, encadrantId }),
    save: (id, vals) => call("admin/sortie", { ...vals, id }),
    create: (vals) => call("admin/sortie", { ...vals, id: null }),
    toggleCancel: (s) => quiet(call("admin/sortie", slotPayload(s, { besoin: s.besoin === 0 ? besoinFor(catsOf(s)) : 0 }))),
    removeSlot: (id) => quiet(call("admin/sortie/remove", { id })),
    updateNiveau: (id, niveau) => quiet(call("admin/encadrant/niveau", { id, niveau })),
    renameEncadrant: (id, name) => call("admin/encadrant/rename", { id, name }),
    addEncadrant: (name, niveau) => call("admin/encadrant", { name, niveau }),
    removeEncadrant: (id) => quiet(call("admin/encadrant/remove", { id })),
    addLieu: (name) => call("admin/lieu", { name }),
    renameLieu: (name, newName) => call("admin/lieu/rename", { name, newName }),
    removeLieu: (name) => quiet(call("admin/lieu/remove", { name })),
  };

  const encadrants = data ? data.encadrants : [];
  const byId = useMemo(() => Object.fromEntries(encadrants.map((e) => [e.id, e])), [encadrants]);
  const me = identity && byId[identity] ? identity : null;
  const setIdentity = (id) => {
    setIdentityState(id);
    try { if (id) localStorage.setItem(IDENTITY_KEY, id); else localStorage.removeItem(IDENTITY_KEY); } catch (e) {}
  };
  const logout = () => { setToken(null); setAdminOK(false); };

  return (
    <div className="min-h-screen bg-[#FAF7F0]">
      <header className="sticky top-0 z-10 bg-[#1B2430] text-white px-5 pt-5 pb-4">
        <div className="flex items-start justify-between gap-3">
          <div>
            <p className="text-[11px] tracking-[0.15em] text-[#D98A57] font-bold uppercase mb-0.5">Brie Francilienne Triathlon</p>
            <h1 className="font-display text-[24px]">Encadrement Jeunes</h1>
          </div>
          <button onClick={() => setHelpOpen(true)} aria-label="Aide" className="shrink-0 flex items-center gap-1.5 rounded-full bg-white/10 hover:bg-white/20 px-3 py-1.5 text-[13px] font-bold"><HelpCircle size={17} /> Aide</button>
        </div>
        <div className="mt-4 flex rounded-xl bg-white/10 p-1 max-w-md">
          {[{ id: "encadrant", label: "Encadrant" }, { id: "admin", label: "Admin" }].map((m) => (
            <button key={m.id} onClick={() => setMode(m.id)}
              className={"flex-1 rounded-lg py-2 text-[13px] font-bold transition-colors " + (mode === m.id ? "bg-white text-[#1B2430]" : "text-white/70")}>
              {m.label}
            </button>
          ))}
        </div>
      </header>
      {helpOpen && <HelpSheet admin={mode === "admin" && adminOK} onClose={() => setHelpOpen(false)} />}
      {notice && (
        <div className="fixed top-3 left-1/2 -translate-x-1/2 w-[calc(100%-2rem)] max-w-md z-30 rounded-2xl bg-[#B03A2E] text-white shadow-lg px-4 py-3 text-[13.5px] font-semibold" onClick={() => setNotice("")}>{notice}</div>
      )}
      {!data ? (
        <div className="px-5 pt-16 max-w-md mx-auto text-center">
          {loadErr ? (
            <>
              <p className="text-[15px] font-semibold text-[#B03A2E] mb-4">{loadErr}</p>
              <button onClick={refresh} className={btnPrimary}>Réessayer</button>
            </>
          ) : <p className="text-[15px] text-[#8A8371]">Chargement du planning…</p>}
        </div>
      ) : mode === "encadrant" ? (
        <UserView data={data} actions={actions} me={me} setIdentity={setIdentity} byId={byId} />
      ) : adminOK ? (
        <AdminView data={data} actions={actions} byId={byId} onLogout={logout} />
      ) : (
        <AdminGate onOK={() => setAdminOK(true)} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
